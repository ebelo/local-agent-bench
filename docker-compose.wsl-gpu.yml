services:
  bench:
    environment:
      LOCAL_AGENT_BENCH_EXECUTION_PROFILE: docker-compose.wsl-gpu

  ollama:
    devices:
      - /dev/dxg:/dev/dxg
    environment:
      LD_LIBRARY_PATH: /usr/lib/wsl/lib:/usr/lib/wsl/drivers
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
      - /usr/lib/wsl/drivers:/usr/lib/wsl/drivers:ro
