<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Repeated latency and protocol gate outcomes</title>
  <desc id="desc">Three models passed the repeated minimal ReAct gate; three were excluded for protocol failures.</desc>
  <defs>
    <style>
      .axis { stroke: #334155; stroke-width: 1; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .pass { fill: #059669; }
      .fail { fill: #dc2626; }
      .txt { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; font-size: 14px; }
      .small { font-family: Arial, Helvetica, sans-serif; fill: #475569; font-size: 12px; }
      .title { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; font-size: 16px; font-weight: 700; }
    </style>
  </defs>
  <rect x="24" y="24" width="912" height="342" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="58" class="title">Primary controlled-core repeated gate</text>
  <text x="44" y="78" class="small">Admission requires at least 2 of 3 get_cwd ReAct attempts with latency &lt;= 20 s and score &gt;= 0.9.</text>

  <line x1="250" y1="306" x2="880" y2="306" class="axis"/>
  <line x1="250" y1="104" x2="250" y2="306" class="axis"/>
  <line x1="250" y1="256" x2="880" y2="256" class="grid"/>
  <line x1="250" y1="205" x2="880" y2="205" class="grid"/>
  <line x1="250" y1="155" x2="880" y2="155" class="grid"/>
  <line x1="250" y1="104" x2="880" y2="104" class="grid"/>
  <text x="220" y="310" class="small">0</text>
  <text x="210" y="260" class="small">0.25</text>
  <text x="218" y="209" class="small">0.50</text>
  <text x="218" y="159" class="small">0.75</text>
  <text x="224" y="108" class="small">1.0</text>

  <text x="250" y="330" class="small">0s</text>
  <text x="407" y="330" class="small">5s</text>
  <text x="562" y="330" class="small">10s</text>
  <text x="718" y="330" class="small">15s</text>
  <text x="870" y="330" class="small">20s</text>
  <line x1="880" y1="104" x2="880" y2="306" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="790" y="98" class="small">20 s threshold</text>

  <circle cx="294" cy="104" r="8" class="pass"/>
  <text x="308" y="108" class="txt">qwen2.5-coder:7b</text>
  <text x="308" y="126" class="small">1.4 s median, 3/3 passes</text>

  <circle cx="407" cy="104" r="8" class="pass"/>
  <text x="421" y="108" class="txt">ornith:9b</text>
  <text x="421" y="126" class="small">5.0 s median, 3/3 passes</text>

  <circle cx="539" cy="104" r="8" class="pass"/>
  <text x="553" y="108" class="txt">qwen3.5:9b</text>
  <text x="553" y="126" class="small">9.2 s median, 3/3 passes</text>

  <circle cx="303" cy="306" r="8" class="fail"/>
  <text x="317" y="310" class="txt">mistral:7b</text>
  <text x="317" y="328" class="small">1.7 s median, 0/3 passes</text>

  <circle cx="296" cy="306" r="8" class="fail"/>
  <text x="44" y="304" class="txt">ibm/granite4.1:8b</text>
  <text x="44" y="322" class="small">1.5 s median, 0/3 passes</text>

  <circle cx="490" cy="256" r="8" class="fail"/>
  <text x="504" y="260" class="txt">lfm2.5:latest</text>
  <text x="504" y="278" class="small">7.6 s median, 0/3 passes</text>

  <rect x="44" y="104" width="150" height="72" fill="#f8fafc" stroke="#cbd5e1" rx="8"/>
  <circle cx="62" cy="128" r="6" class="pass"/>
  <text x="78" y="132" class="small">admitted</text>
  <circle cx="62" cy="154" r="6" class="fail"/>
  <text x="78" y="158" class="small">excluded by gate</text>
</svg>
