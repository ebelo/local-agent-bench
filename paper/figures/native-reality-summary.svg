<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">API-forced platform-native reality score and latency</title>
  <desc id="desc">Mean API-forced native-reality scores and average latency per task for Pi and Hermes native models, with caveat that Pi plain-prompt tool use is unresolved.</desc>
  <defs>
    <style>
      .axis { stroke: #334155; stroke-width: 1; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .pi { fill: #2563eb; }
      .hermes { fill: #16a34a; }
      .txt { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; font-size: 13px; }
      .small { font-family: Arial, Helvetica, sans-serif; fill: #475569; font-size: 11px; }
      .title { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; font-size: 16px; font-weight: 700; }
      .label { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; font-size: 12px; font-weight: 700; }
    </style>
  </defs>
  <rect x="24" y="24" width="912" height="392" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="58" class="title">API-forced native reality: score and latency</text>
  <text x="44" y="78" class="small">These rows used prompts that explicitly required structured API/curl behavior; they do not prove spontaneous Pi tool use.</text>

  <line x1="86" y1="322" x2="880" y2="322" class="axis"/>
  <line x1="86" y1="112" x2="86" y2="322" class="axis"/>
  <line x1="86" y1="252" x2="880" y2="252" class="grid"/>
  <line x1="86" y1="182" x2="880" y2="182" class="grid"/>
  <line x1="86" y1="112" x2="880" y2="112" class="grid"/>
  <text x="58" y="326" class="small">0</text>
  <text x="58" y="256" class="small">1</text>
  <text x="58" y="186" class="small">2</text>
  <text x="58" y="116" class="small">3</text>
  <text x="44" y="98" class="label">Mean score</text>

  <circle cx="140" cy="112" r="14" class="pi"/>
  <text x="105" y="350" class="txt">Pi Mistral</text>
  <text x="118" y="368" class="small">3.00/3</text>
  <text x="121" y="386" class="small">5.0s</text>

  <circle cx="255" cy="112" r="14" class="pi" opacity="0.82"/>
  <text x="212" y="350" class="txt">Pi Granite</text>
  <text x="234" y="368" class="small">3.00/3</text>
  <text x="235" y="386" class="small">26.5s</text>

  <circle cx="370" cy="126" r="13" class="pi" opacity="0.72"/>
  <text x="334" y="350" class="txt">Pi Ornith</text>
  <text x="351" y="368" class="small">2.80/3</text>
  <text x="351" y="386" class="small">30.7s</text>

  <circle cx="485" cy="126" r="13" class="pi" opacity="0.62"/>
  <text x="446" y="350" class="txt">Pi Qwen3.5</text>
  <text x="466" y="368" class="small">2.80/3</text>
  <text x="466" y="386" class="small">35.9s</text>

  <circle cx="600" cy="112" r="14" class="hermes"/>
  <text x="553" y="350" class="txt">Hermes Mistral</text>
  <text x="579" y="368" class="small">3.00/3</text>
  <text x="584" y="386" class="small">7.4s</text>

  <circle cx="715" cy="116" r="14" class="hermes" opacity="0.82"/>
  <text x="664" y="350" class="txt">Hermes Granite</text>
  <text x="694" y="368" class="small">2.95/3</text>
  <text x="694" y="386" class="small">20.1s</text>

  <circle cx="830" cy="133" r="13" class="hermes" opacity="0.72"/>
  <text x="781" y="350" class="txt">Hermes Ornith</text>
  <text x="810" y="368" class="small">2.70/3</text>
  <text x="810" y="386" class="small">22.0s</text>

  <rect x="700" y="52" width="14" height="14" class="pi"/>
  <text x="720" y="64" class="small">Pi native</text>
  <rect x="790" y="52" width="14" height="14" class="hermes"/>
  <text x="810" y="64" class="small">Hermes native</text>

  <text x="44" y="414" class="small">OpenClaw-native rows hit futility; Pi/Mistral later failed the exact plain prompt "What is the current weather in Paris?" under stricter scoring.</text>
</svg>
