<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Controlled runtime-effect results</title>
  <desc id="desc">Grouped bars showing smoke and agentic scores for OpenClaw, Hermes, and Pi controlled ReAct runtime adapters.</desc>
  <defs>
    <style>
      .axis { stroke: #334155; stroke-width: 1; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .smoke { fill: #2563eb; }
      .agentic { fill: #10b981; }
      .txt { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; font-size: 13px; }
      .small { font-family: Arial, Helvetica, sans-serif; fill: #475569; font-size: 11px; }
      .title { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; font-size: 16px; font-weight: 700; }
      .label { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; font-size: 12px; font-weight: 700; }
    </style>
  </defs>
  <rect x="24" y="24" width="912" height="392" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="58" class="title">Secondary controlled runtime-effect scores</text>
  <text x="44" y="78" class="small">Only runtime/model combinations admitted by the repeated gate are shown. Scores are means over 10 runs per suite.</text>

  <line x1="96" y1="322" x2="888" y2="322" class="axis"/>
  <line x1="96" y1="112" x2="96" y2="322" class="axis"/>
  <line x1="96" y1="280" x2="888" y2="280" class="grid"/>
  <line x1="96" y1="238" x2="888" y2="238" class="grid"/>
  <line x1="96" y1="196" x2="888" y2="196" class="grid"/>
  <line x1="96" y1="154" x2="888" y2="154" class="grid"/>
  <line x1="96" y1="112" x2="888" y2="112" class="grid"/>
  <text x="70" y="326" class="small">0</text>
  <text x="70" y="242" class="small">2</text>
  <text x="70" y="158" class="small">4</text>
  <text x="70" y="116" class="small">5</text>
  <text x="76" y="100" class="label">Mean score out of 5</text>

  <rect x="154" y="145" width="28" height="177" class="smoke"/>
  <rect x="190" y="213" width="28" height="109" class="agentic"/>
  <text x="118" y="346" class="small">OpenClaw</text>
  <text x="112" y="362" class="small">Mistral</text>
  <text x="151" y="139" class="small">4.22</text>
  <text x="188" y="207" class="small">2.60</text>

  <rect x="342" y="146" width="28" height="176" class="smoke"/>
  <rect x="378" y="142" width="28" height="180" class="agentic"/>
  <text x="316" y="346" class="small">Hermes</text>
  <text x="294" y="362" class="small">Qwen2.5</text>
  <text x="339" y="140" class="small">4.20</text>
  <text x="376" y="136" class="small">4.28</text>

  <rect x="530" y="157" width="28" height="165" class="smoke"/>
  <rect x="566" y="215" width="28" height="107" class="agentic"/>
  <text x="508" y="346" class="small">Hermes</text>
  <text x="494" y="362" class="small">Mistral</text>
  <text x="527" y="151" class="small">3.92</text>
  <text x="564" y="209" class="small">2.55</text>

  <rect x="718" y="154" width="28" height="168" class="smoke"/>
  <rect x="754" y="139" width="28" height="183" class="agentic"/>
  <text x="710" y="346" class="small">Pi</text>
  <text x="684" y="362" class="small">Qwen2.5</text>
  <text x="715" y="148" class="small">4.00</text>
  <text x="752" y="133" class="small">4.35</text>

  <rect x="328" y="386" width="14" height="14" class="smoke"/>
  <text x="348" y="398" class="small">smoke</text>
  <rect x="404" y="386" width="14" height="14" class="agentic"/>
  <text x="424" y="398" class="small">agentic</text>
  <text x="44" y="398" class="small">Runtime scaffolding changes admission and scores; these rows are secondary evidence, not the primary raw-model ranking.</text>
</svg>
